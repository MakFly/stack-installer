---
- name: Install Zsh dependencies
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - curl
    state: present
    update_cache: true

- name: Clone or update Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ target_home }}/.oh-my-zsh"
    version: master
    depth: 1
    update: true

- name: Check current zshrc
  ansible.builtin.stat:
    path: "{{ target_home }}/.zshrc"
  register: zshrc_stat

- name: Check whether zshrc is managed
  ansible.builtin.command: grep -qxF '# Managed by stack-installer' "{{ target_home }}/.zshrc"
  register: zshrc_managed
  changed_when: false
  failed_when: false
  when: zshrc_stat.stat.exists

- name: Back up unmanaged zshrc
  ansible.builtin.copy:
    src: "{{ target_home }}/.zshrc"
    dest: "{{ target_home }}/.zshrc.backup.{{ ansible_date_time.iso8601_basic_short }}"
    remote_src: true
    mode: preserve
  when:
    - zshrc_stat.stat.exists
    - zshrc_managed.rc != 0

- name: Install managed zshrc
  ansible.builtin.copy:
    dest: "{{ target_home }}/.zshrc"
    mode: "0644"
    content: |
      {% raw %}
      # Managed by stack-installer
      export ZSH="$HOME/.oh-my-zsh"
      ZSH_THEME=""
      autoload -Uz colors
      colors

      HISTFILE="$HOME/.zsh_history"
      HISTSIZE=10000
      SAVEHIST=10000
      setopt append_history
      setopt share_history
      setopt hist_ignore_dups
      setopt hist_reduce_blanks
      setopt autocd
      unsetopt correct_all

      plugins=(
        git
        docker
        docker-compose
        npm
        node
        composer
        ansible
        zsh-autosuggestions
        zsh-syntax-highlighting
      )

      ZSH_AUTOSUGGEST_STRATEGY=(history completion)
      ZSH_AUTOSUGGEST_HIGHLIGHT_STYLE='fg=8'

      stack_prompt() {
        local branch marker time_now cwd
        time_now="$(print -P '%D{%H:%M:%S}')"
        cwd="${PWD/#$HOME/~}"

        if command -v git >/dev/null 2>&1 && git -C "$PWD" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          branch="$(git -C "$PWD" symbolic-ref --short HEAD 2>/dev/null || git -C "$PWD" rev-parse --short HEAD 2>/dev/null)"
          branch="${branch:-detached}"
          marker="${fg[magenta]}[git:${branch}]${reset_color}"
          printf '%s %s %s $ ' "${fg[cyan]}${time_now}${reset_color}" "${fg[blue]}${cwd}${reset_color}" "${marker}"
          return
        fi

        printf '%s %s $ ' "${fg[cyan]}${time_now}${reset_color}" "${fg[blue]}${cwd}${reset_color}"
      }

      source "$ZSH/oh-my-zsh.sh"

      setopt NO_BEEP
      setopt PROMPT_SUBST

      export EDITOR="${EDITOR:-nano}"
      export VISUAL="${VISUAL:-$EDITOR}"
      PROMPT='$(stack_prompt)'

      alias ll='ls -lah'
      alias la='ls -A'
      alias dc='docker compose'
      alias dps='docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"'
      {% endraw %}

- name: Own Oh My Zsh files
  ansible.builtin.file:
    path: "{{ target_home }}/.oh-my-zsh"
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    recurse: true
  failed_when: false

- name: Own managed zshrc
  ansible.builtin.file:
    path: "{{ target_home }}/.zshrc"
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
  failed_when: false

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /usr/bin/zsh
  when: target_user != 'root'
