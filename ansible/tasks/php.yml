---
- name: Find existing ondrej/php PPA source files
  ansible.builtin.shell: |
    grep -rlE 'ppa\.launchpad(content)?\.net/(~)?ondrej/php|ppa:ondrej/php' /etc/apt/sources.list.d /etc/apt/sources.list 2>/dev/null || true
  args:
    executable: /bin/bash
  register: php_ppa_source_files
  changed_when: false

- name: Remove ondrej/php PPA source files from sources.list.d
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ php_ppa_source_files.stdout_lines | select('match', '^/etc/apt/sources\\.list\\.d/') | list }}"

- name: Disable ondrej/php entries in /etc/apt/sources.list
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: '^(.*(ppa\.launchpad(content)?\.net/(~)?ondrej/php|ppa:ondrej/php).*)$'
    replace: '# disabled by stack-installer: \1'
  when: "'/etc/apt/sources.list' in php_ppa_source_files.stdout_lines"

- name: Install PHP repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - apt-transport-https
    state: present
    update_cache: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Sury PHP key on Debian
  ansible.builtin.get_url:
    url: https://packages.sury.org/php/apt.gpg
    dest: /etc/apt/keyrings/sury-php.asc
    mode: "0644"
  when: ansible_facts['distribution'] == "Debian"

- name: Add Sury PHP repository on Debian
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/sury-php.asc] https://packages.sury.org/php/ {{ ansible_facts['distribution_release'] }} main"
    filename: sury-php
    state: present
    update_cache: true
  when: ansible_facts['distribution'] == "Debian"

- name: Detect latest packaged PHP 8.x
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache search --names-only '^php[0-9]+\.[0-9]+$' \
      | awk '{print $1}' \
      | sed 's/^php//' \
      | awk '/^8\./' \
      | sort -V \
      | tail -n1
  args:
    executable: /bin/bash
  register: detected_php_version
  changed_when: false
  when: php_version | length == 0

- name: Set selected PHP version
  ansible.builtin.set_fact:
    stack_php_version: "{{ php_version if php_version | length > 0 else detected_php_version.stdout }}"

- name: Fail when no PHP 8.x package was detected
  ansible.builtin.fail:
    msg: "Could not detect a packaged PHP 8.x version."
  when: stack_php_version | length == 0

- name: Install PHP 8.x core packages without web server packages
  ansible.builtin.apt:
    name:
      - "php{{ stack_php_version }}-cli"
      - "php{{ stack_php_version }}-common"
    state: latest
    install_recommends: false

- name: Install packaged PHP 8.x extensions when available
  ansible.builtin.apt:
    name: "{{ item }}"
    state: latest
    install_recommends: false
  loop:
    - "php{{ stack_php_version }}-curl"
    - "php{{ stack_php_version }}-mbstring"
    - "php{{ stack_php_version }}-xml"
    - "php{{ stack_php_version }}-zip"
    - "php{{ stack_php_version }}-intl"
    - "php{{ stack_php_version }}-bcmath"
    - "php{{ stack_php_version }}-opcache"
    - "php{{ stack_php_version }}-readline"
    - "php{{ stack_php_version }}-gd"
    - "php{{ stack_php_version }}-gmp"
    - "php{{ stack_php_version }}-sqlite3"
  register: php_extension_install
  failed_when: false

- name: Enable PHP gmp extension
  ansible.builtin.command: "phpenmod -v {{ stack_php_version }} gmp"
  register: php_enmod_gmp
  changed_when: "'already enabled' not in php_enmod_gmp.stderr and 'already enabled' not in php_enmod_gmp.stdout"
  failed_when: false

- name: Enable PHP sqlite3 extension
  ansible.builtin.command: "phpenmod -v {{ stack_php_version }} sqlite3"
  register: php_enmod_sqlite3
  changed_when: "'already enabled' not in php_enmod_sqlite3.stderr and 'already enabled' not in php_enmod_sqlite3.stdout"
  failed_when: false
